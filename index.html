<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时API数据显示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>API数据查看器</h1>
    <div>
        <label for="macAddress">输入MAC地址:</label>
        <input type="text" id="macAddress" name="macAddress" placeholder="例如: 5C-53-10-11-11-3A">
        <div id="macError" style="color: red; font-size: 0.9em; height: 1em;"></div> {/* New error message div */}
        <button id="fetchButton">获取数据</button>
    </div>
    <h2>消息:</h2>
    <div id="messageArea">
        <p>等待数据...</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
